source = $HOME/.config/hypr/mocha.conf

$accent = $text
$accentAlpha = $textAlpha
$font = JetBrainsMono Nerd Font

# GENERAL
general {
    disable_loading_bar = true
    hide_cursor = true
}

# BACKGROUND
background {
    monitor =
    path = ~/.config/backgrounds/fog_forest_2.png
    blur_passes = 2
    color = $base
}

# TIME
label {
    monitor =
    text = cmd[update:30000] echo "$(date +"%R")"
    color = $text
    font_size = 80
    font_family = $font
    position = 0, -300
    halign = center
    valign = top
}

# DATE 
label {
    monitor = 
    text = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"
    color = $text
    font_size = 25
    font_family = $font
    position = 0, -440
    halign = center
    valign = top
}

# USER AVATAR

image {
    monitor = 
    path = ~/Pictures/mr house.jpg
    size = 100
    border_color = $accent

    position = 0, 175
    halign = center
    valign = bottom
}

# INPUT FIELD
input-field {
    monitor =
    size = 175, 40
    outline_thickness = 2
    dots_size = 0.1
    dots_spacing = 0.1
    dots_center = true
    outer_color = $accent
    inner_color = $surface0
    font_color = $text
    fade_on_empty = false
    placeholder_text = <span foreground="##$textAlpha"><i>󰌾 Logged in as </i><span foreground="##$accentAlpha">$USER</span></span>
    hide_input = false
    check_color = $accent
    fail_color = $red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $yellow
    position = 0, -35
    halign = center
    valign = center
}
