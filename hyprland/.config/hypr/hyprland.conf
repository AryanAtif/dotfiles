-- Hyprland Lua Config
-- Converted from hyprland.conf
-- See https://wiki.hypr.land/Configuring/Start/

-- Source catppuccin mocha colors
-- NOTE: rename mocha.conf to mocha.lua and place it in ~/.config/hypr/,
-- then uncomment the line below:
-- require("mocha")

--------------------
---- MONITOR ----
--------------------

hl.monitor({
    output   = "",
    mode     = "preferred",
    position = "auto",
    scale    = 1,
})

---------------------
---- MY PROGRAMS ----
---------------------

local terminal    = "kitty"
local fileManager = "dolphin"
local menu        = "wofi --show drun"
local mainMod     = "SUPER"

----------------------------
---- ENVIRONMENT VARIABLES ----
----------------------------

hl.env("XDG_CURRENT_DESKTOP", "Hyprland")
hl.env("XDG_SESSION_TYPE",    "wayland")
hl.env("XDG_SESSION_DESKTOP", "Hyprland")
hl.env("XCURSOR_SIZE",        "10")
hl.env("QT_QPA_PLATFORMTHEME","qt6ct")
hl.env("QT_STYLE_OVERRIDE",   "Fusion")
hl.env("GTK_THEME",           "adw-gtk3")

-------------------
---- AUTOSTART ----
-------------------

hl.on("hyprland.start", function()
    hl.exec_cmd("hyprctl setcursor catppuccin-mocha-dark-cursors 20")
    hl.exec_cmd("/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1")
    hl.exec_cmd("/usr/lib/xdg-desktop-portal-hyprland")
    hl.exec_cmd("/usr/lib/xdg-desktop-portal-gtk")
    hl.exec_cmd("waybar")
    hl.exec_cmd("dunst")
    hl.exec_cmd("hyprpaper")
    hl.exec_cmd("hypridle")
    hl.exec_cmd("XDG_MENU_PREFIX=arch- kbuildsycoca6 --noincremental") -- fix dolphin program finding
    -- GTK / GNOME settings
    hl.exec_cmd("gsettings set org.gnome.desktop.interface text-scaling-factor 0.97")
    hl.exec_cmd("gsettings set org.gnome.desktop.interface cursor-size 10")
    hl.exec_cmd('gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"')
    hl.exec_cmd('gsettings set org.gnome.desktop.interface gtk-theme "adw-gtk3"')
end)

-------------------
---- XWAYLAND ----
-------------------

hl.config({
    xwayland = {
        force_zero_scaling = true,
    },
})

-----------------
---- INPUT ----
-----------------

hl.config({
    input = {
        kb_layout      = "us",
        kb_variant     = "",
        kb_model       = "",
        kb_options     = "",
        kb_rules       = "",
        follow_mouse   = 1,
        sensitivity    = 0,
        touchpad = {
            natural_scroll = true,
        },
    },
})

-------------------
---- GENERAL ----
-------------------

hl.config({
    general = {
        border_size          = 3,
        col_active_border    = "rgba(33ccffee) rgba(00ff99ee) 45deg",
        col_inactive_border  = "rgba(595959aa)",
        resize_on_border     = true,
        gaps_in              = 4,
        gaps_out             = 8,
        layout               = "dwindle",
        allow_tearing        = false,
    },
})

---------------------
---- DECORATION ----
---------------------

hl.config({
    decoration = {
        rounding = 4,
        blur = {
            enabled = true,
            size    = 3,
            passes  = 1,
        },
    },
})

--------------------
---- ANIMATIONS ----
--------------------

hl.curve("linear", { type = "bezier", points = { {0.0, 0.0}, {1, 1} } })

hl.anim("borderangle", { enabled = true, speed = 50,  curve = "linear", style = "loop" })
hl.anim("workspaces",  { enabled = true, speed = 0.5, curve = "default" })
hl.anim("windows",     { enabled = false, speed = 0.1, curve = "default" })
hl.anim("fade",        { enabled = false, speed = 0.1, curve = "default" })

----------------
---- MISC ----
----------------

hl.config({
    misc = {
        force_default_wallpaper = 0,
        disable_hyprland_logo   = false,
    },
})

-------------------------
---- PER-DEVICE INPUT ----
-------------------------

hl.device({
    name        = "epic-mouse-v1",
    sensitivity = -0.5,
})

--------------------
---- KEYBINDS ----
--------------------

-- Sound
hl.bind("XF86AudioRaiseVolume", hl.dsp.exec_cmd("pactl set-sink-volume @DEFAULT_SINK@ +5%"))
hl.bind("XF86AudioLowerVolume", hl.dsp.exec_cmd("pactl set-sink-volume @DEFAULT_SINK@ -5%"))
hl.bind("XF86AudioMute",        hl.dsp.exec_cmd("pactl set-sink-mute @DEFAULT_SINK@ toggle"))

-- Brightness
hl.bind("XF86MonBrightnessUp",   hl.dsp.exec_cmd("brightnessctl set +5%"))
hl.bind("XF86MonBrightnessDown", hl.dsp.exec_cmd("brightnessctl set 5%-"))

-- Calculator
hl.bind("XF86Calculator", hl.dsp.exec_cmd("gnome-calculator"))

-- Core binds
hl.bind(mainMod .. " + Return", hl.dsp.exec_cmd(terminal))
hl.bind(mainMod .. " + C",      hl.dsp.window.close())
hl.bind(mainMod .. " + M",      hl.dsp.exit())
hl.bind(mainMod .. " + V",      hl.dsp.window.float({ action = "toggle" }))
hl.bind(mainMod .. " + Space",  hl.dsp.exec_cmd(menu))
hl.bind(mainMod .. " + SHIFT + L", hl.dsp.exec_cmd("hyprlock"))
hl.bind(mainMod .. " + SHIFT + R", hl.dsp.exec_cmd("hyprctl reload"))

-- Screenshots (hyprshot)
hl.bind("Print",         hl.dsp.exec_cmd("env HYPRSHOT_DIR=/home/mr-house/Pictures/Screenshots hyprshot -m window"))
hl.bind("SHIFT + Print", hl.dsp.exec_cmd("env HYPRSHOT_DIR=/home/mr-house/Pictures/Screenshots hyprshot -m region"))

-- Waybar
hl.bind(mainMod .. " + W", hl.dsp.exec_cmd("pkill waybar && waybar"))
hl.bind(mainMod .. " + Q", hl.dsp.exec_cmd("pkill waybar"))
hl.bind(mainMod .. " + E", hl.dsp.exec_cmd("waybar"))

-- Apps
hl.bind(mainMod .. " + D", hl.dsp.exec_cmd(fileManager))
hl.bind(mainMod .. " + I", hl.dsp.exec_cmd("swaync-client -t"))
hl.bind(mainMod .. " + A", hl.dsp.exec_cmd("flatpak run io.appflowy.AppFlowy"))
hl.bind(mainMod .. " + O", hl.dsp.exec_cmd("flatpak run md.obsidian.Obsidian"))

-- Dwindle
hl.bind(mainMod .. " + P", hl.dsp.dwindle.pseudo())
hl.bind(mainMod .. " + F", hl.dsp.window.fullscreen())

-- Focus (vim-style)
hl.bind(mainMod .. " + H", hl.dsp.window.focus("l"))
hl.bind(mainMod .. " + L", hl.dsp.window.focus("r"))
hl.bind(mainMod .. " + K", hl.dsp.window.focus("u"))
hl.bind(mainMod .. " + J", hl.dsp.window.focus("d"))

-- Switch workspaces
for i = 1, 9 do
    hl.bind(mainMod .. " + " .. i, hl.dsp.workspace.switch(i))
end
hl.bind(mainMod .. " + 0", hl.dsp.workspace.switch(10))

-- Move window to workspace
for i = 1, 9 do
    hl.bind(mainMod .. " + SHIFT + " .. i, hl.dsp.window.move({ workspace = i }))
end
hl.bind(mainMod .. " + SHIFT + 0", hl.dsp.window.move({ workspace = 10 }))

-- Special workspace (scratchpad)
hl.bind(mainMod .. " + S",         hl.dsp.workspace.toggle_special("magic"))
hl.bind(mainMod .. " + SHIFT + S", hl.dsp.window.move({ workspace = "special:magic" }))

-- Scroll through workspaces with mouse wheel
hl.bind(mainMod .. " + mouse_down", hl.dsp.workspace.switch("e+1"))
hl.bind(mainMod .. " + mouse_up",   hl.dsp.workspace.switch("e-1"))

-- Move/resize windows with mouse
hl.bindm(mainMod .. " + mouse:272", hl.dsp.window.move())
hl.bindm(mainMod .. " + mouse:273", hl.dsp.window.resize())
